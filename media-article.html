<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecture — ATP MEDIA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="atp-theme.css?v=20261108-16"><style>body{background:#f7f5ef;color:#26372e}.article-wrap{width:min(850px,calc(100% - 36px));margin:45px auto 80px}.article-head{padding:38px;border-radius:22px;background:linear-gradient(130deg,#e9f0e5,#f7f5ef);border:1px solid #dfe6da}.article-head h1{color:#244b3a}.article-head p{color:#52665b;line-height:1.8}.article-body{margin-top:24px;padding:32px;background:#fffefa;border:1px solid #e3e5d9;border-radius:18px}.article-body h2{color:#28533f}.article-body p{color:#4d6055;line-height:1.85}.article-back{display:inline-block;margin-top:22px;color:#28664e;font-weight:800;text-decoration:none}</style></head><body><main class="article-wrap"><header class="article-head"><span>AFRIQUE TECH PLUS MEDIA · FICHE PRATIQUE</span><h1 id="title">Chargement…</h1><p id="intro"></p></header><article class="article-body" id="body"></article><a class="article-back" href="media.html">← Retour à la bibliothèque Media</a></main><script>const data={securite:{title:"Protéger ses comptes en ligne",intro:"Les gestes essentiels pour réduire les risques de piratage et d’usurpation.",body:"<h2>Mots de passe uniques</h2><p>Choisis un mot de passe différent pour chaque service important. Une phrase longue est préférable à un mot simple.</p><h2>Double authentification</h2><p>Active la validation en deux étapes et conserve les codes de secours dans un endroit sûr.</p><h2>Repérer les fraudes</h2><p>Méfie-toi des messages urgents, des promesses de gains et des demandes de confirmation. Ouvre le site officiel toi-même plutôt que de cliquer sur un lien douteux.</p><h2>Protéger les codes</h2><p>Ne communique jamais un code OTP, mot de passe ou code PIN, même à une personne prétendant représenter une banque ou un opérateur.</p><h2>Contrôler les sessions</h2><p>Vérifie les appareils connectés, déconnecte les sessions inconnues et mets tes appareils à jour.</p>"},fichiers:{title:"Bien organiser ses fichiers",intro:"Une méthode simple pour retrouver rapidement ses cours et documents.",body:"<h2>Construire une arborescence</h2><p>Crée un dossier principal par année ou projet, puis un sous-dossier par matière ou activité.</p><h2>Nommer clairement</h2><p>Utilise des noms explicites : matière_chapitre_date_version. Évite les noms vagues.</p><h2>Séparer les versions</h2><p>Conserve les originaux à part et indique clairement les versions modifiées.</p><h2>Sauvegarder</h2><p>Fais une sauvegarde sur un support distinct ou un cloud fiable et vérifie que les fichiers s’ouvrent.</p><h2>Nettoyer</h2><p>Ne supprime les doublons qu’après avoir vérifié qu’une copie correcte existe ailleurs.</p>"},tableur:{title:"Créer un tableau de suivi",intro:"Utiliser un tableur pour suivre ses dépenses, ses tâches ou ses révisions.",body:"<h2>Définir l’objectif</h2><p>Choisis une finalité : budget, présence, devoirs, inventaire ou suivi de projet.</p><h2>Structurer les données</h2><p>Prépare des colonnes comme date, élément, catégorie, montant et statut. Une ligne correspond à une entrée.</p><h2>Filtrer</h2><p>Active les filtres pour retrouver les entrées par date, catégorie ou statut.</p><h2>Formules utiles</h2><p>Utilise SOMME pour les totaux, MOYENNE pour une moyenne et NB.SI pour compter selon un critère.</p><h2>Contrôler</h2><p>Compare quelques résultats à des calculs manuels et protège les cellules de formules.</p>"},ia:{title:"Vérifier une réponse d’intelligence artificielle",intro:"Distinguer une réponse convaincante d’une information exacte.",body:"<h2>Repérer les affirmations</h2><p>Identifie les dates, noms, statistiques, lois et citations qui peuvent être contrôlés.</p><h2>Ouvrir les sources</h2><p>Demande les références, puis ouvre-les réellement. Une source inventée peut sembler crédible.</p><h2>Comparer</h2><p>Compare plusieurs sources fiables et privilégie les organismes officiels pour les démarches.</p><h2>Vérifier la date</h2><p>Une information exacte hier peut être dépassée aujourd’hui.</p><h2>Garder son jugement</h2><p>L’IA aide à apprendre, mais ne remplace ni la vérification ni ta compréhension.</p>"}};const key=new URLSearchParams(location.search).get("article");const item=data[key]||data.securite;document.title=item.title+" — ATP MEDIA";document.getElementById("title").textContent=item.title;document.getElementById("intro").textContent=item.intro;document.getElementById("body").innerHTML=item.body;</script></body></html>
