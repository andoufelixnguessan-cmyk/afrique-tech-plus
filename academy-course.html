<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f5ee">
  <meta name="description" content="AFRIQUE TECH PLUS ACADEMY : découvre des formations numériques accessibles à tous.">
  <title>Formation | AFRIQUE TECH PLUS ACADEMY</title>

  <style>
    :root {
      --bg: #f7f5ee;
      --panel: #fffefa;
      --blue: #24563e;
      --blue-dark: #203b30;
      --indigo: #a7b99b;
      --text: #26372e;
      --muted: #68756b;
      --border: #e8eee3;
      --shadow: 0 12px 30px rgba(36, 110, 67,.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: min(1150px, 90%);
      margin: auto;
    }

    /* NAVIGATION */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 18px rgba(35, 110, 66,.05);
    }

    .navigation {
      min-height: 75px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #203b30;
    }

    .brand span {
      color: var(--blue);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .nav-links a {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      transition: .2s;
    }

    .nav-links a:hover {
      color: var(--blue);
    }

    .nav-button {
      padding: 11px 17px;
      border-radius: 9px;
      background: var(--blue);
      color: #fffefa !important;
      font-weight: 700;
    }

    /* HERO */

    .hero {
      padding: 95px 0 85px;
      background:
        radial-gradient(ellipse at 80% 20%, rgba(87, 200, 134,.13), transparent 45%),
        radial-gradient(ellipse at 10% 90%, rgba(40, 216, 113,.13), transparent 40%),
        linear-gradient(135deg,#f7f5ee,#e8eee3 58%,#e8eee3);
    }

    .hero-content {
      max-width: 800px;
    }

    .eyebrow {
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .hero h1 {
      color: #203b30;
      font-size: clamp(38px, 6vw, 65px);
      line-height: 1.12;
      margin: 22px 0;
    }

    .hero h1 span {
      color: var(--indigo);
    }

    .hero p {
      color: var(--muted);
      font-size: 17px;
      max-width: 650px;
      margin-bottom: 30px;
    }

    .primary-button {
      display: inline-block;
      padding: 14px 22px;
      background: linear-gradient(135deg,var(--blue),var(--indigo));
      color: #fffefa;
      border-radius: 10px;
      font-weight: 800;
      transition: .2s;
      box-shadow: 0 8px 20px rgba(40, 216, 113,.16);
    }

    .primary-button:hover {
      transform: translateY(-3px);
      filter: brightness(1.05);
    }

    /* AVANTAGES */

    .benefits {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      padding: 20px 0 85px;
    }

    .benefit {
      display: flex;
      flex-direction: column;
      padding: 23px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 15px;
      box-shadow: 0 5px 18px rgba(36, 110, 67,.045);
    }

    .benefit-icon {
      font-size: 27px;
      color: var(--blue);
    }

    .benefit h3 {
      color: #203b30;
      margin: 12px 0 7px;
      font-size: 16px;
    }

    .benefit p {
      color: var(--muted);
      font-size: 13px;
    }

    /* CATALOGUE */

    .catalogue {
      padding: 30px 0 90px;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 30px;
    }

    .section-heading h2 {
      color: #203b30;
      font-size: 32px;
      margin-top: 10px;
    }

    .section-heading p {
      color: var(--muted);
      margin-top: 6px;
    }

    .catalogue-label {
      color: var(--blue);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    /* CERTIFICATION */

    .certification {
      display: flex;
      align-items: center;
      gap: 25px;
      padding: 30px;
      margin-bottom: 85px;
      background: #e8eee3;
      border: 1px solid #e8eee3;
      border-radius: 18px;
    }

    .certification-icon {
      font-size: 45px;
    }

    .certification h3 {
      color: #203b30;
    }

    .certification p {
      color: var(--muted);
      font-size: 14px;
      margin-top: 8px;
    }

    /* ESPACE PERSONNEL COMPACT */

    #academy-dashboard {
      padding-top: 45px;
      padding-bottom: 65px;
    }

    #academy-dashboard .section-heading {
      padding: 23px 25px;
      margin-bottom: 20px;
      background: linear-gradient(120deg,#e8eee3,#e8eee3);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    #academy-dashboard .section-heading h2 {
      color: #203b30;
      font-size: 27px;
    }

    #academy-dashboard .section-heading p {
      color: var(--muted);
      font-size: 14px;
    }

    /* ONGLET HORIZONTAUX */

    .academy-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      background: #fffefa;
      border: 1px solid var(--border);
      border-radius: 13px;
      box-shadow: 0 4px 14px rgba(36, 110, 67,.04);
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }

    .academy-tab {
      flex: 1 0 auto;
      min-height: 42px;
      padding: 10px 15px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      color: #68756b;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: .2s;
    }

    .academy-tab:hover {
      background: #f7f5ee;
      color: var(--blue);
    }

    .academy-tab[aria-selected="true"] {
      background: linear-gradient(135deg,#24563e,#a7b99b);
      color: #fffefa;
      box-shadow: 0 4px 12px rgba(40, 216, 113,.17);
    }

    /* CONTENU DES ONGLETS */

    .academy-tab-panel {
      min-height: 150px;
      padding: 23px;
      background: #fffefa;
      border: 1px solid var(--border);
      border-radius: 15px;
      box-shadow: 0 5px 18px rgba(36, 110, 67,.045);
    }

    .academy-tab-panel[hidden] {
      display: none !important;
    }

    .academy-panel-title {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 15px;
    }

    .academy-panel-icon {
      display: grid;
      place-items: center;
      width: 39px;
      height: 39px;
      flex: 0 0 39px;
      border-radius: 11px;
      background: #e8eee3;
      color: var(--blue);
      font-size: 20px;
    }

    .academy-panel-title h3 {
      color: #203b30;
      font-size: 17px;
    }

    .academy-tab-panel p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .academy-tab-panel .primary-button {
      margin-top: 16px;
      padding: 10px 15px;
      font-size: 12px;
    }

    #academy-enrollments,
    #academy-progress {
      width: 100%;
    }

    #academy-dashboard-status {
      margin-top: 15px;
      padding: 12px 14px;
      background: #f7f5ee;
      border: 1px solid #e8eee3;
      border-radius: 10px;
      font-size: 13px;
    }

    /* CATALOGUE DYNAMIQUE */

    #academy-dynamic-catalogue {
      width: 100%;
    }

    #academy-dynamic-catalogue .atp-live-courses {
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 22px;
      align-items: stretch;
    }

    #academy-dynamic-catalogue .atp-live-card,
    #academy-dynamic-catalogue .atp-module,
    #academy-dynamic-catalogue .atp-lesson,
    #academy-dynamic-catalogue .atp-quiz,
    #academy-dynamic-catalogue .atp-progress {
      background: #fffefa !important;
      color: #26372e !important;
      border: 1px solid #e8eee3 !important;
      border-radius: 16px !important;
      box-shadow: 0 6px 20px rgba(36, 110, 67,.055);
    }

    #academy-dynamic-catalogue .atp-live-card {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    #academy-dynamic-catalogue .atp-live-card h2,
    #academy-dynamic-catalogue .atp-live-card h3,
    #academy-dynamic-catalogue .atp-module h3,
    #academy-dynamic-catalogue .atp-lesson h3 {
      color: #203b30 !important;
    }

    #academy-dynamic-catalogue .atp-live-card p,
    #academy-dynamic-catalogue .atp-module p,
    #academy-dynamic-catalogue .atp-lesson p,
    #academy-dynamic-catalogue .atp-quiz p {
      color: #68756b !important;
    }

    #academy-dynamic-catalogue button,
    #academy-dynamic-catalogue .atp-button {
      background: linear-gradient(135deg,#24563e,#a7b99b) !important;
      color: #fffefa !important;
      border-color: transparent !important;
      border-radius: 10px !important;
    }

    #academy-dynamic-catalogue .atp-progress-bar,
    #academy-dynamic-catalogue progress {
      accent-color: #24563e;
    }

    /* FOOTER */

    footer {
      padding: 35px 0;
      background: #203b30;
      border-top: 1px solid #e8eee3;
      text-align: center;
      color: #fffefa;
    }

    footer p {
      color: #dcfae9;
      font-size: 13px;
      margin-top: 8px;
    }

    footer a {
      color: #a9ffcd;
    }

    /* RESPONSIVE */

    @media(max-width: 900px) {
      .benefits {
        grid-template-columns: repeat(2,minmax(0,1fr));
      }

      #academy-dynamic-catalogue .atp-live-courses {
        grid-template-columns: repeat(2,minmax(0,1fr));
      }
    }

    @media(max-width: 600px) {
      .navigation {
        flex-direction: column;
        padding: 17px 0;
      }

      .nav-links {
        justify-content: center;
        flex-wrap: wrap;
        gap: 15px;
      }

      .hero {
        padding: 65px 0;
      }

      .benefits,
      #academy-dynamic-catalogue .atp-live-courses {
        grid-template-columns: 1fr;
      }

      .section-heading {
        align-items: flex-start;
        flex-direction: column;
      }

      .certification {
        align-items: flex-start;
        flex-direction: column;
      }

      #academy-dashboard .section-heading {
        padding: 18px;
      }

      #academy-dashboard .section-heading h2 {
        font-size: 23px;
      }

      .academy-tabs {
        gap: 6px;
        padding: 6px;
      }

      .academy-tab {
        min-height: 39px;
        padding: 9px 12px;
        font-size: 12px;
      }

      .academy-tab-panel {
        padding: 17px;
      }
    }

    [hidden] {
      display: none !important;
    }
  </style>
  <link rel="stylesheet" href="atp-theme.css?v=20261108-28">
</head>

  </style>

  <script src="config.js"></script>
